name: CI — Escapes Admin

# El push a main despliega en Coolify: esto tiene que estar verde antes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # vite build no comprueba tipos: sin este paso se desplegaban errores
      # como variables no definidas.
      - name: TypeScript
        run: npx tsc --noEmit
      - run: npm run build
